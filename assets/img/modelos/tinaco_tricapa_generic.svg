<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="peSandTri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBB18B"/>
      <stop offset="50%" stop-color="#E5D1B5"/>
      <stop offset="100%" stop-color="#B89B73"/>
    </linearGradient>
    <linearGradient id="peBlackTri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#404040"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="peFoamTri" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="shadowTri" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <circle cx="150" cy="150" r="130" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <g filter="url(#shadowTri)">
    <!-- 1. Capa Exterior (Arena) -->
    <path d="M 90 90 Q 150 75 210 90 L 220 220 Q 150 235 80 220 Z" fill="url(#peSandTri)" stroke="#9A7B56" stroke-width="2"/>
    
    <!-- Ribs -->
    <path d="M 88 125 Q 150 115 212 125" fill="none" stroke="#A88B67" stroke-width="3"/>
    <path d="M 85 160 Q 150 150 215 160" fill="none" stroke="#A88B67" stroke-width="3"/>
    <path d="M 83 195 Q 150 185 217 195" fill="none" stroke="#A88B67" stroke-width="3"/>

    <!-- 2. Capa Intermedia UV (Negro) -->
    <path d="M 115 105 Q 150 95 185 105 L 180 205 Q 150 215 120 205 Z" fill="url(#peBlackTri)" stroke="#09090B" stroke-width="1.5"/>

    <!-- 3. Capa Interior (Espumado) -->
    <path d="M 130 115 Q 150 108 170 115 L 165 195 Q 150 202 135 195 Z" fill="url(#peFoamTri)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Lid / Tapa -->
    <ellipse cx="150" cy="85" rx="45" ry="12" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <ellipse cx="150" cy="82" rx="20" ry="5" fill="#334155"/>
  </g>

  <!-- Labels -->
  <text x="150" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">TINACO TRICAPA</text>
  <text x="150" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">1/3 Arena • 1/3 Negro UV • 1/3 Espumado</text>
</svg>
