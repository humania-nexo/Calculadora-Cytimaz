<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="peTamboGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadowTambo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <circle cx="150" cy="150" r="130" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <g filter="url(#shadowTambo)">
    <!-- Tambo Cilíndrico con cinchos de refuerzo -->
    <path d="M 100 85 L 200 85 L 195 220 L 105 220 Z" fill="url(#peTamboGrad)" stroke="#0369A1" stroke-width="2"/>
    
    <!-- Cinchos / Anillos -->
    <path d="M 98 120 L 202 120" stroke="#0C4A6E" stroke-width="4"/>
    <path d="M 97 155 L 203 155" stroke="#0C4A6E" stroke-width="4"/>
    <path d="M 96 190 L 204 190" stroke="#0C4A6E" stroke-width="4"/>

    <!-- Tapa Superior con tapones -->
    <ellipse cx="150" cy="85" rx="50" ry="12" fill="#0369A1" stroke="#0C4A6E" stroke-width="2"/>
    <circle cx="130" cy="85" r="6" fill="#0F172A"/>
    <circle cx="170" cy="85" r="4" fill="#0F172A"/>
  </g>

  <!-- Labels -->
  <text x="150" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0F172A">TAMBO ESTÁNDAR 200L</text>
  <text x="150" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748B">100% Polietileno (6 kg)</text>
</svg>
