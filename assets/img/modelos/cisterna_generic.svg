<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="peCisternaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="shadowCisterna" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <circle cx="150" cy="150" r="130" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2"/>
  
  <g filter="url(#shadowCisterna)">
    <!-- Cisterna Horizontal / Subterránea Reforzada -->
    <rect x="50" y="105" width="200" height="110" rx="45" ry="45" fill="url(#peCisternaGrad)" stroke="#0C4A6E" stroke-width="2.5"/>
    
    <!-- Anillos de Refuerzo Estructural (Rotomoldeo) -->
    <path d="M 90 105 L 90 215" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 130 105 L 130 215" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 170 105 L 170 215" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 210 105 L 210 215" stroke="#0369A1" stroke-width="4" stroke-linecap="round"/>

    <!-- Pata de apoyo / Base -->
    <rect x="75" y="210" width="30" height="12" rx="3" fill="#0C4A6E"/>
    <rect x="195" y="210" width="30" height="12" rx="3" fill="#0C4A6E"/>

    <!-- Cuello de inspección y tapa roscada -->
    <rect x="130" y="85" width="40" height="22" rx="4" fill="#0369A1" stroke="#0C4A6E" stroke-width="2"/>
    <ellipse cx="150" cy="85" rx="26" ry="7" fill="#0F172A" stroke="#0284C7" stroke-width="1.5"/>
  </g>

  <!-- Labels -->
  <text x="150" y="260" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369A1">CISTERNA DE POLIETILENO</text>
  <text x="150" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0284C7">100% Puro Polietileno Virgen</text>
</svg>
