<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0284C7">
  <meta name="description" content="Calculadora de balance de materias primas y órdenes de producción para rotomoldeo de tinacos y cisternas - Cytimaz">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cytimaz Calc">
  
  <title>Cytimaz • Calculadora de Materia Prima para Rotomoldeo</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.svg">

  <!-- Estilos Visuales Modulares -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ENCABEZADO PRINCIPAL DE LA APLICACIÓN -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-wrapper">
        <div class="brand-logo-icon">C</div>
        <div class="brand-text">
          <h1>CYTIMAZ</h1>
          <span class="tagline">Calculadora de Materiales • Rotomoldeo</span>
        </div>
      </div>

      <div class="header-actions-right">
        <!-- Indicador del peso de saco activo (por defecto 24 kg) -->
        <div class="header-badge" id="header-bag-badge" title="Peso de saco estándar configurado">
          📦 Sacos: <strong>24 kg</strong>
        </div>

        <!-- Botón de Instalación PWA (Visible en navegadores compatibles) -->
        <button class="btn btn-outline btn-sm" id="btn-pwa-install" style="display:none;" onclick="App.installPWA()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Instalar App
        </button>

        <!-- Botón de Configuración y Modelos (Engranaje) -->
        <button class="btn btn-outline btn-sm" id="btn-settings" title="Panel de Configuración y Modelos (Protegido por clave)" onclick="App.openSettingsModal()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Ajustes
        </button>
      </div>
    </div>
  </header>

  <!-- BARRA DE PESTAÑAS (NAVEGACIÓN SIN RECARGA) -->
  <nav class="nav-tabs-wrapper">
    <div class="nav-tabs-container">
      <button class="nav-tab-btn active" data-tab="mod-pt-mp" onclick="App.switchTab('mod-pt-mp')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        <span>1. PT ➔ Materia Prima</span>
      </button>

      <button class="nav-tab-btn" data-tab="mod-mp-pt" onclick="App.switchTab('mod-mp-pt')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span>2. Materia Prima ➔ PT</span>
      </button>

      <button class="nav-tab-btn" data-tab="mod-informe" onclick="App.switchTab('mod-informe')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>3. Fichas e Informes</span>
      </button>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL DE LOS 3 MÓDULOS -->
  <main class="main-content">
    <!-- MÓDULO 1: Producto Terminado -> Materia Prima -->
    <section id="mod-pt-mp-container" class="module-container"></section>

    <!-- MÓDULO 2: Materia Prima -> Producto Terminado -->
    <section id="mod-mp-pt-container" class="module-container" style="display:none;"></section>

    <!-- MÓDULO 3: Fichas Técnicas e Informes Individuales -->
    <section id="mod-informe-container" class="module-container" style="display:none;"></section>
  </main>

  <!-- MODAL DE CONFIGURACIÓN Y MODELOS (ENGRANAJE ⚙️) -->
  <div id="settings-modal" class="modal-backdrop" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:0.5rem;">
          <span style="font-size:1.3rem;">⚙️</span>
          <h3 style="font-size:1.15rem; font-weight:700;">Panel de Ajustes y Modelos Cytimaz</h3>
        </div>
        <button class="btn-icon" onclick="App.closeSettingsModal()" title="Cerrar modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="settings-modal-body">
        <!-- Renderizado dinámico desde app.js (PIN o formulario de edición) -->
      </div>
    </div>
  </div>

  <!-- NOTIFICACIONES TOAST FLOTANTES -->
  <div id="toast-notification" class="toast-bar"></div>

  <!-- SCRIPTS MODULARES Y COMENTADOS -->
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/mod-pt-mp.js"></script>
  <script src="js/mod-mp-pt.js"></script>
  <script src="js/mod-informe.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
